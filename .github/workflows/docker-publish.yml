name: Release & publicar imagem (ghcr.io)

# A cada push na main: calcula a PRÓXIMA versão (semver automático por
# Conventional Commits), cria a tag + GitHub Release, builda a imagem multi-arch
# e publica no GitHub Packages (ghcr.io/<owner>/<repo>) com as tags X.Y.Z, X.Y e
# latest. Instala com `docker pull` sem buildar.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Forçar incremento (patch|minor|major)"
        required: false
        default: ""

permissions:
  contents: write # criar tag + release
  packages: write # publicar no ghcr

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo p/ ler tags e commits

      - name: Próxima versão (semver automático)
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags --force
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          [ -z "$last" ] && last="v0.0.0"
          IFS=. read -r MA MI PA <<< "${last#v}"
          # commits desde a última tag (ou todos, se não há tag)
          if [ "$last" = "v0.0.0" ]; then range=""; else range="${last}..HEAD"; fi
          log=$(git log ${range} --pretty=%B || true)
          # bump por Conventional Commits: feat -> minor; BREAKING/! -> major; senão patch
          bump=patch
          echo "$log" | grep -qiE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE' && bump=major || \
          { echo "$log" | grep -qiE '^feat(\(.+\))?:' && bump=minor; } || true
          # override manual via workflow_dispatch
          manual="${{ github.event.inputs.bump }}"
          [ -n "$manual" ] && bump="$manual"
          case "$bump" in
            major) MA=$((MA+1)); MI=0; PA=0;;
            minor) MI=$((MI+1)); PA=0;;
            *)     PA=$((PA+1));;
          esac
          new="v${MA}.${MI}.${PA}"
          echo "bump=$bump  nova_versao=$new  (anterior=$last)"
          echo "new_tag=$new"        >> "$GITHUB_OUTPUT"
          echo "version=${MA}.${MI}.${PA}" >> "$GITHUB_OUTPUT"
          echo "minor=${MA}.${MI}"   >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$new" -m "Release $new"
          git push origin "$new"

      - name: Setup QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags e labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.minor }}
            type=sha,format=short

      - name: Build e push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.new_tag }}" \
            --title "${{ steps.ver.outputs.new_tag }}" \
            --generate-notes
