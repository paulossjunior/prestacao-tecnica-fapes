services:
  - type: web
    name: prestacao-tecnica-fapes
    runtime: python
    plan: free                 # efêmero: avaliações somem a cada deploy/restart/sleep
    buildCommand: pip install -r requirements.txt
    # timeout alto + threads: no free tier a análise pode levar vários minutos.
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 600
    envVars:
      # ---- LLM (OpenAI) ----
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false            # SECRET: definir no dashboard
      - key: OPENAI_MODEL
        value: gpt-4o          # análise (qualidade)
      - key: OPENAI_OCR_MODEL
        value: gpt-5.4-nano    # OCR (barato)
      # ---- Login SIGFAPES ----
      # NÃO use "USER": colide com o usuário do SO no Render. Use SIGFAPES_*.
      - key: SIGFAPES_USER
        sync: false            # SECRET: login do SIGFAPES
      - key: SIGFAPES_PASSWORD
        sync: false            # SECRET: senha do SIGFAPES
      - key: SIGFAPES_SITE
        value: https://www.sigfapes.es.gov.br
      # ---- Runtime ----
      - key: PYTHON_VERSION
        value: "3.12.8"
