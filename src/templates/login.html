<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Prestação de Contas (FAPES)</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;}
  .login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:28px 24px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .login-brand{display:flex;align-items:center;gap:11px;margin-bottom:18px;}
  .login-brand .logo{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;
    background:var(--accent);color:#fff;font-weight:700;font-size:13px;}
  .login-brand .t1{font-weight:650;font-size:15px;} .login-brand .t2{font-size:11.5px;color:var(--muted);}
  .login-card label{display:block;font-size:11.5px;color:var(--muted);margin:12px 0 4px;font-weight:600;}
  .login-card input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
    font-size:14px;background:var(--surface);color:var(--ink);}
  .login-card input:focus{outline:none;border-color:var(--accent);}
  .login-card .btn.primary{width:100%;justify-content:center;margin-top:18px;padding:11px;}
  .login-erro{margin-top:12px;color:var(--bad);background:var(--bad-bg);border:1px solid var(--bad-line);
    border-radius:9px;padding:9px 11px;font-size:12.5px;}
</style>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" method="post" action="/login{{ ('?next=' ~ request.args.get('next')) if request.args.get('next') }}">
      <div class="login-brand">
        <div class="logo">FAP</div>
        <div><div class="t1">Prestação de Contas Técnica</div>
          <div class="t2">Avaliação FAPES · acesso restrito</div></div>
      </div>
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" type="text" autocomplete="username" autofocus required>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      {% if erro %}<div class="login-erro">{{ erro }}</div>{% endif %}
      <button class="btn primary" type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
